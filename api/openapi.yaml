        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Questions of the selected test
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AdminTestQuestionItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/tests/{testId}/publish:
    post:
      tags: [Admin tests]
      operationId: adminPublishTest
      summary: Publish a valid test
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/TestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published test
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTestDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/tests/{testId}/archive:
    post:
      tags: [Admin tests]
      operationId: adminArchiveTest
      summary: Archive a test without deleting historical attempts
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/TestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Archived test
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTestDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}

  /admin/media/uploads:
    post:
      tags: [Admin media]
      operationId: adminCreateMediaUpload
      summary: Create a direct-upload reservation for an image or document
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaUploadRequest'}
      responses:
        '201':
          description: Short-lived upload reservation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaUploadReservation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/media/images:
    post:
      tags: [Admin media]
      operationId: adminUploadQuestionImage
      summary: Upload and optimize an image for a question
      security: [{BearerAuth: []}]
      x-required-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                altText: {type: [string, 'null'], maxLength: 500}
      responses:
        '201':
          description: Optimized WebP image
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OptimizedImageAsset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/media/uploads/{uploadId}/complete:
    post:
      tags: [Admin media]
      operationId: adminCompleteMediaUpload
      summary: Verify an uploaded object and create a media asset
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteMediaUploadRequest'}
      responses:
        '201':
          description: Media asset created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAsset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/imports:
    get:
      tags: [Admin imports]
      operationId: adminListImports
      summary: List SQLite import runs
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - name: sourceName
          in: query
          schema:
            type: string
            enum: [history_dates, history_terms, society_terms, society_plans]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Import run page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRunPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin imports]
      operationId: adminStartImport
      summary: Validate and import one supported SQLite source
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sourceName, file]
              properties:
                sourceName:
                  type: string
                  enum: [history_dates, history_terms, society_terms, society_plans]
                dryRun:
                  type: boolean
                  default: true
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/imports/{importId}:
    get:
      tags: [Admin imports]
      operationId: adminGetImport
      summary: Get import status and validation errors
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - name: importId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Import run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/audit:
    get:
      tags: [Admin audit]
      operationId: adminListAuditEvents
      summary: List append-only administrative audit events
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - name: entityType
          in: query
          schema: {type: string}
        - name: entityId
          in: query
          schema: {type: string, format: uuid}
        - name: action
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit event page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /me/practice:
    get:
      tags:
      - Profile
      operationId: getPracticeProgress
      summary: History trainer totals and statistics by task and period
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Completed attempt totals, groups, and current mistakeCount
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/practice/attempts:
    get:
      tags:
      - Profile
      operationId: getMyTrainerAttempts
      summary: List owned history trainer attempts
      security:
      - BearerAuth: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Owned attempts, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/messages:
    post:
      tags:
      - Profile
      operationId: createStudentMessage
      summary: Submit a message and queue an administrator email notification
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 5
                  maxLength: 2000
      responses:
        '201':
          description: Message saved on the platform; notification queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionErrorReportCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: At most five messages per ten minutes
  /admin/notification-settings:
    get:
      tags:
      - Admin practice
      operationId: getAdminNotificationSettings
      summary: Read administrator notification address and pending mail count
      security:
      - BearerAuth: []
      x-required-role: admin
      responses:
        '200':
          description: email, smtpConfigured, pendingCount
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Admin practice
      operationId: setAdminNotificationSettings
      summary: Set the shared administrator notification email
      security:
      - BearerAuth: []
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Notification address saved
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/messages/{reportId}/read:
    post:
      tags: [Profile]
      operationId: markStudentMessageRead
      summary: Mark one owned administrator reply as read
      security: [{BearerAuth: []}]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Message marked read}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Secure HttpOnly SameSite refresh cookie
    AnonymousSession:
      type: apiKey
      in: header
      name: X-Anonymous-Session
      description: Opaque short-lived token returned when an anonymous attempt starts

  parameters:
    SubjectCode:
      name: subjectCode
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SubjectCode'}
    SubjectFilter:
      name: subject
      in: query
      schema: {$ref: '#/components/schemas/SubjectCode'}
    ContentTypeFilter:
      name: type
      in: query
      schema:
        type: array
        maxItems: 8
        items: {$ref: '#/components/schemas/ContentType'}
      style: form
      explode: false
    SectionFilter:
      name: sectionId
      in: query
      schema: {type: string, format: uuid}
    PublicationStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/PublicationStatus'}
    ContentId:
      name: contentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReferenceBookId:
      name: referenceBookId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReferenceEntryId:
      name: referenceEntryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SectionId:
      name: sectionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TestId:
      name: testId
      in: path
      required: true
      schema: {type: string, format: uuid}
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 500}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Reusing the key with a different body returns 409.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: ETag from the latest GET; prevents lost updates.

  responses:
    AuthSuccess:
      description: Authentication succeeded; refresh token is stored in a secure cookie
      headers:
        Set-Cookie:
          schema: {type: string}
          description: Secure HttpOnly refresh cookie
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthResponse'}
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated user lacks permission or does not own the resource
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist or is not publicly visible
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Request conflicts with current resource or idempotency state
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match does not match the current ETag
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: Semantic validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    SubjectCode:
      type: string
      enum: [history, society]
    ContentType:
      type: string
      enum: [date, term, plan, person, event, map, theory, other]
    PublicationStatus:
      type: string
      enum: [draft, published, archived]
    QuestionType:
      type: string
      enum: [single_choice, multiple_choice, text, matching, ordering, map, graph, self_check]
    AttemptStatus:
      type: string
      enum: [in_progress, completed, abandoned, expired]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, time]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
        time: {type: string, format: date-time}

    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string}

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        traceId: {type: string}
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
              questionId: {type: string, format: uuid}
              similarity: {type: number, minimum: 0, maximum: 1}

    PageMeta:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}

    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}

    EmailCodeVerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email, maxLength: 254}
        code: {type: string, pattern: '^\d{6}$'}
        displayName: {type: string, minLength: 1, maxLength: 120}

    TelegramExchangeRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData: {type: string, minLength: 1, maxLength: 10000}

    MaxExchangeRequest:
      type: object
      additionalProperties: false
      required: [launchData]
      properties:
        launchData: {type: string, minLength: 1, maxLength: 10000}

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 60, example: 900}

    AuthResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [user, isNewUser]
          properties:
            user: {$ref: '#/components/schemas/UserProfile'}
            isNewUser: {type: boolean}

    UserProfile:
      type: object
      additionalProperties: false
      required: [id, role, status, displayName, providers, createdAt]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [student, admin]}
        status: {type: string, enum: [active, blocked]}
        displayName: {type: [string, 'null']}
        email: {type: [string, 'null'], format: email}
        avatarUrl: {type: [string, 'null'], format: uri}
        timezone: {type: string}
        providers:
          type: array
          uniqueItems: true
          items: {type: string, enum: [email, telegram, max]}
        createdAt: {type: string, format: date-time}

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: [string, 'null'], maxLength: 120}
        timezone: {type: string, minLength: 1, maxLength: 64}

    Subject:
      type: object
      additionalProperties: false
      required: [code, title, sortOrder]
      properties:
        code: {$ref: '#/components/schemas/SubjectCode'}
        title: {type: string}
        sortOrder: {type: integer}

    SectionSummary:
      type: object
      required: [id, subject, code, title, sortOrder]
      properties:
        id: {type: string, format: uuid}
        subject: {$ref: '#/components/schemas/SubjectCode'}
        parentId: {type: [string, 'null'], format: uuid}
        code: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        sortOrder: {type: integer}

    SectionNode:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SectionSummary'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: {$ref: '#/components/schemas/SectionNode'}

    ContentSummary:
      type: object
      required: [id, subject, type, title, slug, updatedAt]
      properties:
        id: {type: string, format: uuid}
        subject: {$ref: '#/components/schemas/SubjectCode'}
        section: {oneOf: [{$ref: '#/components/schemas/SectionSummary'}, {type: 'null'}]}
        type: {$ref: '#/components/schemas/ContentType'}
        title: {type: string}
        slug: {type: string}
        summary: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}

    TermFeature:
      type: object
      additionalProperties: false
      required: [type, text, position]
      properties:
        type: {type: string}
        text: {type: string}
        position: {type: integer, minimum: 0}

    PlanItem:
      type: object
      additionalProperties: false
      required: [id, text, position, children]
      properties:
        id: {type: string, format: uuid}
        text: {type: string}
        position: {type: integer, minimum: 0}
        children:
          type: array
          items: {$ref: '#/components/schemas/PlanItem'}

    DateDetails:
      type: object
      additionalProperties: false
      required: [kind, dateLabel, precision, eventText]
      properties:
        kind: {type: string, const: date}
        dateLabel: {type: string}
        dateStart: {type: [string, 'null'], format: date}
        dateEnd: {type: [string, 'null'], format: date}
        precision:
          type: string
          enum: [day, month, year, range, century, approximate, unknown]
        eventText: {type: string}

    TermDetails:
      type: object
      additionalProperties: false
      required: [kind, definition, features]
      properties:
        kind: {type: string, const: term}
        definition: {type: string}
        features:
          type: array
          items: {$ref: '#/components/schemas/TermFeature'}

    PlanDetails:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind: {type: string, const: plan}
        introduction: {type: [string, 'null']}
        conclusion: {type: [string, 'null']}
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanItem'}

    PlanItemWrite:
      type: object
      additionalProperties: false
      required: [text, position, children]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Omit for a new item; preserve for an existing item during replacement.
        text: {type: string, minLength: 1}
        position: {type: integer, minimum: 0}
        children:
          type: array
          items: {$ref: '#/components/schemas/PlanItemWrite'}

    PlanDetailsWrite:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind: {type: string, const: plan}
        introduction: {type: [string, 'null']}
        conclusion: {type: [string, 'null']}
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanItemWrite'}

    GenericDetails:
      type: object
      required: [kind, body]
      properties:
        kind: {type: string, const: generic}
        body: {type: object, additionalProperties: true}

    ContentDetails:
      oneOf:
        - $ref: '#/components/schemas/DateDetails'
        - $ref: '#/components/schemas/TermDetails'
        - $ref: '#/components/schemas/PlanDetails'
        - $ref: '#/components/schemas/GenericDetails'
      discriminator:
        propertyName: kind

    ContentDetailsWrite:
      oneOf:
        - $ref: '#/components/schemas/DateDetails'
        - $ref: '#/components/schemas/TermDetails'
        - $ref: '#/components/schemas/PlanDetailsWrite'
        - $ref: '#/components/schemas/GenericDetails'
      discriminator:
        propertyName: kind

    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, url, filename, mimeType, byteSize, checksumSha256, createdAt]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        filename: {type: string}
        mimeType: {type: string}
        byteSize: {type: integer, minimum: 1}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        altText: {type: [string, 'null']}
        checksumSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}

    OptimizedImageAsset:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/MediaAsset'
        - type: object
          required: [originalByteSize, savedPercent]
          properties:
            originalByteSize: {type: integer, minimum: 1}
            savedPercent: {type: integer, minimum: 0, maximum: 100}

    ContentDetail:
      allOf:
        - $ref: '#/components/schemas/ContentSummary'
        - type: object
          required: [aliases, details, assets, isFavorite]
          properties:
            aliases:
              type: array
              items: {type: string}
            details: {$ref: '#/components/schemas/ContentDetails'}
            assets:
              type: array
              items: {$ref: '#/components/schemas/MediaAsset'}
            isFavorite:
              description: False for anonymous users.
              type: boolean

