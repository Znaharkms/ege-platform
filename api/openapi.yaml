            position: {type: integer, minimum: 1}
            points: {type: number, exclusiveMinimum: 0}
            pointsOverride: {type: [number, 'null'], exclusiveMinimum: 0}
            required: {type: boolean}
            image:
              oneOf:
                - $ref: '#/components/schemas/MediaAsset'
                - type: 'null'

    TestQuestionRef:
      type: object
      additionalProperties: false
      required: [questionId, position, required]
      properties:
        questionId: {type: string, format: uuid}
        position: {type: integer, minimum: 1}
        pointsOverride: {type: [number, 'null'], exclusiveMinimum: 0}
        required: {type: boolean, default: true}

    GenerationBlueprint:
      type: object
      additionalProperties: false
      required: [questionCount]
      properties:
        questionCount: {type: integer, minimum: 1, maximum: 100}
        sectionIds:
          type: array
          items: {type: string, format: uuid}
        questionTypes:
          type: array
          items: {$ref: '#/components/schemas/QuestionType'}
        tagIds:
          type: array
          items: {type: string, format: uuid}
        randomizeQuestions: {type: boolean, default: true}

    AdminTestCreate:
      type: object
      additionalProperties: false
      required: [subject, title, mode]
      properties:
        subject: {$ref: '#/components/schemas/SubjectCode'}
        sectionId: {type: [string, 'null'], format: uuid}
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: [string, 'null'], maxLength: 5000}
        mode: {type: string, enum: [fixed, generated]}
        timeLimitSeconds: {type: [integer, 'null'], minimum: 1}
        questions:
          type: array
          items: {$ref: '#/components/schemas/TestQuestionRef'}
        blueprint:
          oneOf:
            - $ref: '#/components/schemas/GenerationBlueprint'
            - type: 'null'

    AdminTestPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sectionId: {type: [string, 'null'], format: uuid}
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: [string, 'null'], maxLength: 5000}
        timeLimitSeconds: {type: [integer, 'null'], minimum: 1}
        questions:
          type: array
          items: {$ref: '#/components/schemas/TestQuestionRef'}
        blueprint:
          oneOf:
            - $ref: '#/components/schemas/GenerationBlueprint'
            - type: 'null'

    AdminTestDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/TestDetail'
        - type: object
          required: [status, questions, createdAt, updatedAt]
          properties:
            status: {$ref: '#/components/schemas/PublicationStatus'}
            questions:
              type: array
              items: {$ref: '#/components/schemas/TestQuestionRef'}
            blueprint:
              oneOf:
                - $ref: '#/components/schemas/GenerationBlueprint'
                - type: 'null'
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            publishedAt: {type: [string, 'null'], format: date-time}
            archivedAt: {type: [string, 'null'], format: date-time}

    AdminTestPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminTestDetail'}
        page: {$ref: '#/components/schemas/PageMeta'}

    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, mimeType, byteSize, checksumSha256]
      properties:
        filename: {type: string, minLength: 1, maxLength: 255}
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/svg+xml, application/pdf]
        byteSize: {type: integer, minimum: 1, maximum: 52428800}
        checksumSha256: {type: string, pattern: '^[0-9a-f]{64}$'}

    MediaUploadReservation:
      type: object
      additionalProperties: false
      required: [uploadId, uploadUrl, method, expiresAt]
      properties:
        uploadId: {type: string, format: uuid}
        uploadUrl: {type: string, format: uri}
        method: {type: string, const: PUT}
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}

    CompleteMediaUploadRequest:
      type: object
      additionalProperties: false
      properties:
        altText: {type: [string, 'null'], maxLength: 500}

    ImportError:
      type: object
      additionalProperties: false
      required: [sourceTable, sourceRecordId, code, message]
      properties:
        sourceTable: {type: string}
        sourceRecordId: {type: string}
        code: {type: string}
        message: {type: string}

    ImportRun:
      type: object
      additionalProperties: false
      required: [id, sourceName, sourceFilename, dryRun, status, counts, errors, startedAt]
      properties:
        id: {type: string, format: uuid}
        sourceName:
          type: string
          enum: [history_dates, history_terms, society_terms, society_plans]
        sourceFilename: {type: string}
        dryRun: {type: boolean}
        status: {type: string, enum: [running, completed, failed, cancelled]}
        counts:
          type: object
          additionalProperties: false
          required: [inserted, updated, skipped, failed]
          properties:
            inserted: {type: integer, minimum: 0}
            updated: {type: integer, minimum: 0}
            skipped: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ImportError'}
        startedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}

    ImportRunPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ImportRun'}
        page: {$ref: '#/components/schemas/PageMeta'}

    ReferenceFieldType:
      type: string
      enum: [text, long_text, number, date, boolean]

    ReferenceFieldCreate:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1, maxLength: 200}
        type: {$ref: '#/components/schemas/ReferenceFieldType'}
        required: {type: boolean, default: false}

    ReferenceField:
      type: object
      additionalProperties: false
      required: [id, key, label, type, required, sortOrder]
      properties:
        id: {type: string, format: uuid}
        key: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        label: {type: string}
        type: {$ref: '#/components/schemas/ReferenceFieldType'}
        required: {type: boolean}
        sortOrder: {type: integer, minimum: 0}

    ReferenceFieldUpdate:
      allOf:
        - $ref: '#/components/schemas/ReferenceFieldCreate'
        - type: object
          properties:
            id: {type: string, format: uuid}

    ReferenceBookCreate:
      type: object
      additionalProperties: false
      required: [subject, title, fields]
      properties:
        subject: {$ref: '#/components/schemas/SubjectCode'}
        title: {type: string, minLength: 1, maxLength: 300}
        fields:
          type: array
          minItems: 1
          maxItems: 30
          items: {$ref: '#/components/schemas/ReferenceFieldCreate'}

    ReferenceBookPatch:
      type: object
      additionalProperties: false
      required: [title, fields]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        fields:
          type: array
          minItems: 1
          maxItems: 30
          items: {$ref: '#/components/schemas/ReferenceFieldUpdate'}

    ReferenceBook:
      type: object
      additionalProperties: false
      required: [id, code, title, subject, subjectTitle, kind, status, fields, recordCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        subject: {$ref: '#/components/schemas/SubjectCode'}
        subjectTitle: {type: string}
        kind: {type: string, enum: [builtin, custom]}
        contentType:
          oneOf:
            - $ref: '#/components/schemas/ContentType'
            - type: 'null'
        sourceName: {type: [string, 'null']}
        status: {type: string, enum: [active, archived]}
        fields:
          type: array
          items: {$ref: '#/components/schemas/ReferenceField'}
        recordCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        archivedAt: {type: [string, 'null'], format: date-time}

    ReferenceBookList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReferenceBook'}

    ReferenceEntryWrite:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true

    ReferenceEntry:
      type: object
      additionalProperties: false
      required: [id, values]
      properties:
        id: {type: string, format: uuid}
        values: {type: object, additionalProperties: true}
        archived: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        archivedAt: {type: [string, 'null'], format: date-time}

    ReferenceEntryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReferenceEntry'}
        page: {$ref: '#/components/schemas/PageMeta'}

    ContentSourceOverview:
      type: object
      additionalProperties: false
      required: [sourceName, label, subject, type, recordCount]
      properties:
        sourceName:
          type: string
          enum: [history_dates, history_terms, society_terms, society_plans]
        label: {type: string}
        subject: {$ref: '#/components/schemas/SubjectCode'}
        type: {$ref: '#/components/schemas/ContentType'}
        recordCount: {type: integer, minimum: 0}
        lastImportedAt: {type: [string, 'null'], format: date-time}
        lastRun:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    ContentCount:
      type: object
      additionalProperties: false
      required: [subject, type, status, count]
      properties:
        subject: {$ref: '#/components/schemas/SubjectCode'}
        type: {$ref: '#/components/schemas/ContentType'}
        status: {$ref: '#/components/schemas/PublicationStatus'}
        count: {type: integer, minimum: 0}

    ContentSourcesResponse:
      type: object
      additionalProperties: false
      required: [sources, contentCounts]
      properties:
        sources:
          type: array
          items: {$ref: '#/components/schemas/ContentSourceOverview'}
        contentCounts:
          type: array
          items: {$ref: '#/components/schemas/ContentCount'}

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, entityType, createdAt]
      properties:
        id: {type: integer, format: int64}
        actorUserId: {type: [string, 'null'], format: uuid}
        action: {type: string}
        entityType: {type: string}
        entityId: {type: [string, 'null'], format: uuid}
        oldData: {type: [object, 'null'], additionalProperties: true}
        newData: {type: [object, 'null'], additionalProperties: true}
        requestId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        page: {$ref: '#/components/schemas/PageMeta'}
