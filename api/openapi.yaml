openapi: 3.1.0
info:
  title: Olesya Blok EGE Platform API
  version: 1.0.0
  summary: Public reference library, EGE practice, personal progress and admin API
  description: |
    REST API for the History and Social Studies web application, Telegram Mini App
    and MAX Mini App.

    All published reference content and tests are public. Registration adds search
    history, favorites, saved attempts, progress, statistics and mistake review.
    Only users with the `admin` role may mutate educational content.

    JSON fields use camelCase. Timestamps are UTC RFC 3339. IDs are UUIDs unless
    explicitly documented otherwise. Pagination is cursor-based.
  contact:
    name: Olesya Blok EGE Online
servers:
  - url: https://api.ege-olesyablok.ru/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Subjects
  - name: Content
  - name: Search
  - name: Tests
  - name: Attempts
  - name: Profile
  - name: Progress
  - name: Admin sections
  - name: Admin content
  - name: Admin questions
  - name: Admin tests
  - name: Admin imports
  - name: Admin media
  - name: Admin audit

security: []

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Service health check
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/email/request-code:
    post:
      tags: [Auth]
      operationId: requestEmailCode
      summary: Request a one-time email sign-in code
      description: Always returns the same response to prevent account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '202':
          description: Code delivery accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/email/verify-code:
    post:
      tags: [Auth]
      operationId: verifyEmailCode
      summary: Sign in or register using an email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeVerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/telegram/exchange:
    post:
      tags: [Auth]
      operationId: exchangeTelegramInitData
      summary: Sign in or register from Telegram Mini App
      description: The server validates Telegram initData before trusting user fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramExchangeRequest'
      responses:
        '200': {$ref: '#/components/responses/AuthSuccess'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/max/exchange:
    post:
      tags: [Auth]
      operationId: exchangeMaxLaunchData
      summary: Sign in or register from MAX Mini App
      description: The server validates signed MAX launch data before trusting user fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxExchangeRequest'
      responses:
        '200': {$ref: '#/components/responses/AuthSuccess'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Refresh an access token
      security:
        - RefreshCookie: []
      responses:
        '200':
          description: Access token refreshed; refresh cookie may be rotated
          headers:
            Set-Cookie:
              schema: {type: string}
              description: Secure HttpOnly refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session revoked and refresh cookie cleared
          headers:
            Set-Cookie:
              schema: {type: string}
              description: Expired refresh cookie
        '401': {$ref: '#/components/responses/Unauthorized'}

  /subjects:
    get:
      tags: [Subjects]
      operationId: listSubjects
      summary: List active subjects
      responses:
        '200':
          description: Active subjects in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Subject'}

  /subjects/{subjectCode}/sections:
    get:
      tags: [Subjects]
      operationId: listSubjectSections
      summary: List the full section tree for a subject
      parameters:
        - $ref: '#/components/parameters/SubjectCode'
      responses:
        '200':
          description: Nested section tree
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SectionNode'}
        '404': {$ref: '#/components/responses/NotFound'}

  /content:
    get:
      tags: [Content]
      operationId: listContent
      summary: List published reference content
      parameters:
        - $ref: '#/components/parameters/SubjectFilter'
        - $ref: '#/components/parameters/ContentTypeFilter'
        - $ref: '#/components/parameters/SectionFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, newest, oldest]
            default: title
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published content page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /content/{contentId}:
    get:
      tags: [Content]
      operationId: getContent
      summary: Get a published content item
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Full published content item
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentDetail'}
        '404': {$ref: '#/components/responses/NotFound'}

  /content/{contentId}/related:
    get:
      tags: [Content]
      operationId: listRelatedContent
      summary: List published related content and tests
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Related resources ordered by relation weight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedContentResponse'
        '404': {$ref: '#/components/responses/NotFound'}

  /search:
    get:
      tags: [Search]
      operationId: searchContent
      summary: Search all published reference content
      description: Exact title and alias matches rank above fuzzy and body matches.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: 1861
        - $ref: '#/components/parameters/SubjectFilter'
        - $ref: '#/components/parameters/ContentTypeFilter'
        - $ref: '#/components/parameters/SectionFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked search results. Query history is stored only for signed-in users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /tests:
    get:
      tags: [Tests]
      operationId: listTests
      summary: List published tests
      parameters:
        - $ref: '#/components/parameters/SubjectFilter'
        - $ref: '#/components/parameters/SectionFilter'
        - name: mode
          in: query
          schema:
            type: string
            enum: [fixed, generated]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published test page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestPage'}

  /tests/{testId}:
    get:
      tags: [Tests]
      operationId: getTest
      summary: Get public test metadata
      description: Does not expose prompts or correct answers before an attempt starts.
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Test metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestDetail'}
        '404': {$ref: '#/components/responses/NotFound'}

  /attempts:
    post:
      tags: [Attempts]
      operationId: startAttempt
      summary: Start a public or authenticated test attempt
      description: |
        If no bearer token is present, an anonymous session is created and its opaque
        token is returned once. Send that token through `X-Anonymous-Session` on every
        later request for this attempt.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartAttemptRequest'}
      responses:
        '201':
          description: Attempt created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StartAttemptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /history-trainer/config:
    get:
      tags: [Tests]
      operationId: getHistoryTrainerConfig
      summary: Get available history trainer filters and exact question counts
      responses:
        '200':
          description: Trainer configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryTrainerConfig'}
        '404': {$ref: '#/components/responses/NotFound'}

  /history-trainer/count:
    post:
      tags: [Tests]
      operationId: countHistoryTrainerQuestions
      summary: Count questions matching the selected history trainer filters
      security:
        - BearerAuth: []
        - AnonymousSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HistoryTrainerCountRequest'}
      responses:
        '200':
          description: Exact number of matching published questions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [questionCount]
                properties:
                  questionCount: {type: integer, minimum: 0}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /history-trainer/attempts:
    post:
      tags: [Attempts]
      operationId: startHistoryTrainerAttempt
      summary: Generate a history training attempt without repeating answered questions
      security:
        - BearerAuth: []
        - AnonymousSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HistoryTrainerStartRequest'}
      responses:
        '201':
          description: Generated attempt created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StartAttemptResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /history-trainer/error-reports:
    post:
      tags: [Attempts]
      operationId: createHistoryTrainerErrorReport
      summary: Report an error in an answered history trainer question
      security:
        - BearerAuth: []
        - AnonymousSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionErrorReportCreate'}
      responses:
        '201':
          description: Error report created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionErrorReportCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /history-trainer/error-reports/mine:
    get:
      tags: [Attempts]
      operationId: listMyHistoryTrainerErrorReports
      summary: List the current student's reports and administrator replies
      security:
        - BearerAuth: []
        - AnonymousSession: []
      parameters:
        - name: markViewed
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Student error reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyQuestionErrorReportList'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /attempts/{attemptId}:
    get:
      tags: [Attempts]
      operationId: getAttempt
      summary: Get an owned attempt and its current state
      security:
        - BearerAuth: []
        - AnonymousSession: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /attempts/{attemptId}/answers:
    post:
      tags: [Attempts]
      operationId: submitAttemptAnswer
      summary: Submit one answer
      security:
        - BearerAuth: []
        - AnonymousSession: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitAnswerRequest'}
      responses:
        '200':
          description: Answer graded. The response contains only this question's result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnswerResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /attempts/{attemptId}/complete:
    post:
      tags: [Attempts]
      operationId: completeAttempt
      summary: Complete an attempt and calculate final results
      security:
        - BearerAuth: []
        - AnonymousSession: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Final result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Get the signed-in user's profile
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Profile]
      operationId: updateCurrentUser
      summary: Update the signed-in user's own profile fields
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/claim-anonymous-attempts:
    post:
      tags: [Profile]
      operationId: claimAnonymousAttempts
      summary: Attach recent anonymous attempts to the signed-in account
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimAnonymousAttemptsRequest'}
      responses:
        '200':
          description: Attempts claimed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimAnonymousAttemptsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}

  /me/search-history:
    get:
      tags: [Profile]
      operationId: getSearchHistory
      summary: Get recent search history
      security: [{BearerAuth: []}]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Recent searches, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SearchHistoryItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      tags: [Profile]
      operationId: clearSearchHistory
      summary: Clear all search history
      security: [{BearerAuth: []}]
      responses:
        '204': {description: Search history cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/favorites:
    get:
      tags: [Profile]
      operationId: listFavorites
      summary: List saved content
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Favorite content page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/favorites/{contentId}:
    put:
      tags: [Profile]
      operationId: addFavorite
      summary: Save a content item
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '204': {description: Content saved; operation is idempotent}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Profile]
      operationId: removeFavorite
      summary: Remove a saved content item
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '204': {description: Content removed; operation is idempotent}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/attempts:
    get:
      tags: [Progress]
      operationId: listMyAttempts
      summary: List saved test attempts
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SubjectFilter'
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, completed, abandoned, expired]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Attempt history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/progress:
    get:
      tags: [Progress]
      operationId: getMyProgress
      summary: Get overall progress by subject
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Personal progress summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/progress/subjects/{subjectCode}:
    get:
      tags: [Progress]
      operationId: getMySubjectProgress
      summary: Get progress and weak sections for one subject
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SubjectCode'
      responses:
        '200':
          description: Subject progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubjectProgressDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/mistakes:
    get:
      tags: [Progress]
      operationId: listMyMistakes
      summary: List questions due for mistake review
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SubjectFilter'
        - name: dueOnly
          in: query
          schema: {type: boolean, default: true}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Mistake review queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MistakePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /me/review-attempts:
    post:
      tags: [Progress]
      operationId: startReviewAttempt
      summary: Generate a test from the signed-in user's mistake queue
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartReviewAttemptRequest'}
      responses:
        '201':
          description: Review attempt created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StartAttemptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/sections:
    get:
      tags: [Admin sections]
      operationId: adminListSections
      summary: List active and inactive sections
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/SubjectFilter'
      responses:
        '200':
          description: Flat section list for administration
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AdminSection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin sections]
      operationId: adminCreateSection
      summary: Create a section
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminSectionWrite'}
      responses:
        '201':
          description: Section created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/sections/{sectionId}:
    patch:
      tags: [Admin sections]
      operationId: adminUpdateSection
      summary: Update, move or deactivate a section
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/SectionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/AdminSectionPatch'}
      responses:
        '200':
          description: Updated section
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}

  /admin/reference-books:
    get:
      tags: [Admin reference books]
      operationId: adminListReferenceBooks
      summary: List active and archived reference books
      security: [{BearerAuth: []}]
      x-required-role: admin
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [active, archived]}
      responses:
        '200':
          description: Reference books
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReferenceBookList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
